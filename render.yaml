# Render Blueprint: free Docker web service. Render asks for the sync:false values on first deploy.
services:
  - type: web
    name: invoice-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.6-flash,gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.8-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM2_MODEL
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
      - key: LLM2_API_KEY
        sync: false
